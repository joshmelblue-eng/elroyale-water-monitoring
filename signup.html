
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Account | El Royale</title>
  <link rel="stylesheet" href="style.css">
  <script src="signup.js" defer></script>
</head>
<body>

  <main class="signup-page">
    <section class="signup-card">

      <div class="signup-heading">
        <div class="signup-logo">💧</div>
        <h1>Request an Account</h1>
        <p>
          Fill out the form below to request access
          to the Water Monitoring System.
        </p>
      </div>

      <form id="signupForm">

        <div class="form-grid">
          <div class="field">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName"
              placeholder="Enter first name"
              autocomplete="given-name" required>
          </div>

          <div class="field">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName"
              placeholder="Enter last name"
              autocomplete="family-name" required>
          </div>
        </div>

        <div class="field">
          <label for="personnelId">Personnel ID</label>
          <input type="text" id="personnelId"
            placeholder="Enter personnel ID" required>
        </div>

        <div class="field">
          <label for="signupEmail">Email Address</label>
          <input type="email" id="signupEmail"
            placeholder="Enter your email"
            autocomplete="email" required>
        </div>

        <div class="field">
          <label for="signupPassword">Password</label>
          <input type="password" id="signupPassword"
            placeholder="Create password"
            autocomplete="new-password"
            minlength="8" required>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword"
            placeholder="Confirm password"
            autocomplete="new-password"
            minlength="8" required>
        </div>

        <p class="form-error" id="signupError"
          role="alert"></p>

        <button type="submit" class="signup-button">
          Submit Request
        </button>

      </form>

      <p class="back-login">
        Already have an account?
        <a href="index.html">Sign In</a>
      </p>

      <p class="approval-note">
        Your account request will be reviewed
        by the system administrator.
      </p>

    </section>
  </main>

</body>
</html>
